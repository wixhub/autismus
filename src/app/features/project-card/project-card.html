<article class="project-card" [class]="modeClass()">
  <div class="card-top">
    <span class="mode-badge">{{ project().operationalMode }}</span>
    <a
      [href]="project().deployUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="deploy-link"
      [attr.aria-label]="'Launch ' + project().title + ' on Cloudflare'"
    >
      <span>Launch</span>
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    </a>
  </div>

  <div class="category-tag">{{ project().category }}</div>
  <h2 class="project-title">{{ project().title }}</h2>
  <p class="project-description">{{ project().description }}</p>

  @if (project().metrics) {
    <div class="metrics-box">
      <span class="metrics-label">Telemetry:</span> {{ project().metrics }}
    </div>
  }

  <div class="tech-stack">
    @for (tech of project().techStack; track tech) {
      <span class="tech-badge">{{ tech }}</span>
    }
  </div>
</article>
